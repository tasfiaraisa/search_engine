
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results — Seekr</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>

<body class="results-page">

    <header class="results-header">
        <a href="/" class="results-logo">
            <img src="/static/logo.png" alt="Seekr Logo">
        </a>

        <form action="/search" method="GET" class="results-search-form">
            <div class="search-input-wrapper">
                <span class="search-icon" aria-hidden="true">⌕</span>

                <input
                    type="search"
                    name="keywords"
                    id="search-box"
                    value="{{ keywords }}"
                    placeholder="Search the web..."
                    aria-label="Search the web"
                    required
                >
            </div>
        </form>
    </header>

    <main class="results-container">

        <h1 class="results-heading">
            Results for "{{ keywords }}"
        </h1>

        <p class="results-count">
            {{ total_results }} results found
        </p>

        % if total_results > 0:
            <div class="results-list">
                {{ !table_rows }}
            </div>
        % else:
            <p class="empty-results">
                No results found. Try a different search term.
            </p>
        % end

        <nav class="pagination" aria-label="Search result pages">

            % if page > 1:
                <a href="/search?keywords={{ keywords }}
